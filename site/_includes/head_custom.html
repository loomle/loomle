<link rel="stylesheet" href="{{ '/assets/css/loomle.css?v=agentic-loom-v15' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/loomle-favicon-32.png' | relative_url }}">

{% assign loomle_ga4_id = site.analytics.ga4_id | default: "" %}
{% assign loomle_cloudflare_beacon_token = site.analytics.cloudflare_beacon_token | default: "" %}
<script>
  window.LOOMLE_ANALYTICS = {
    ga4Id: {{ loomle_ga4_id | jsonify }},
    cloudflareBeaconToken: {{ loomle_cloudflare_beacon_token | jsonify }}
  };
</script>
<script defer src="{{ '/assets/js/loomle-analytics.js?v=agentic-loom-v15' | relative_url }}"></script>
