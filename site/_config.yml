title: Loomle AI
description: Loomle AI builds SAL, Loomle MCP, and OASIUM for human–AI creation.
url: "https://loomle.ai"
baseurl: ""

theme: just-the-docs

search_enabled: true
heading_anchors: true
color_scheme: loomle

aux_links:
  GitHub:
    - https://github.com/loomle/loomle
  Releases:
    - https://github.com/loomle/loomle/releases

footer_content: "LOOMLE / PROGRAMMABLE LOOM · Agent-native Unreal Engine tooling."
back_to_top: true
back_to_top_text: "Back to top"

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

exclude:
  - .bundle
  - .ruby-version
  - bin
  - Gemfile
  - Gemfile.lock
  - README.md
