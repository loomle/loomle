name: Promote Verified Loomle GitHub Release

on:
  workflow_dispatch:
    inputs:
      mac_run_id:
        description: Successful Verify Loomle Fab Plugin (Mac) workflow run ID
        required: true
        type: string
      windows_run_id:
        description: Successful Verify Loomle Fab Plugin (Windows) workflow run ID
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - final

permissions:
  actions: read
  contents: write

concurrency:
  group: promote-loomle-github-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Verification Runs
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_RUN_ID: ${{ inputs.mac_run_id }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
        run: |
          set -euo pipefail
          for run_id in "$MAC_RUN_ID" "$WINDOWS_RUN_ID"; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || {
              echo "verification run IDs must be numeric GitHub Actions run IDs." >&2
              exit 1
            }
          done
          mac_run_json="$RUNNER_TEMP/mac-verification-run.json"
          windows_run_json="$RUNNER_TEMP/windows-verification-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAC_RUN_ID" > "$mac_run_json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WINDOWS_RUN_ID" > "$windows_run_json"
          head_sha="$(node -e '
            const fs = require("node:fs");
            const runs = [
              {
                label: "Mac",
                path: ".github/workflows/verify-fab-mac.yml",
                run: JSON.parse(fs.readFileSync(process.argv[1], "utf8")),
              },
              {
                label: "Windows",
                path: ".github/workflows/verify-fab-windows.yml",
                run: JSON.parse(fs.readFileSync(process.argv[2], "utf8")),
              },
            ];
            for (const { label, path, run } of runs) {
              const expected = {
                path,
                status: "completed",
                conclusion: "success",
                event: "workflow_dispatch",
                head_branch: "main",
              };
              for (const [field, value] of Object.entries(expected)) {
                if (run[field] !== value) {
                  throw new Error(`${label} verification run ${field} is ${JSON.stringify(run[field])}; expected ${JSON.stringify(value)}`);
                }
              }
              if (run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY) {
                throw new Error(`${label} verification run belongs to another repository`);
              }
              if (!/^[0-9a-f]{40}$/.test(run.head_sha ?? "")) {
                throw new Error(`${label} verification run has no valid head SHA`);
              }
            }
            if (runs[0].run.head_sha !== runs[1].run.head_sha) {
              throw new Error("Mac and Windows verification runs do not test the same commit");
            }
            process.stdout.write(runs[0].run.head_sha);
          ' "$mac_run_json" "$windows_run_json")"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout Exact Verified Commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.head_sha }}

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download Exact Verified Artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_RUN_ID: ${{ inputs.mac_run_id }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
        run: |
          set -euo pipefail
          mkdir -p \
            "$RUNNER_TEMP/fab-source/mac" \
            "$RUNNER_TEMP/fab-source/windows"
          for ue in ue5.7 ue5.8; do
            mkdir -p \
              "$RUNNER_TEMP/qa/$ue/mac" \
              "$RUNNER_TEMP/qa/$ue/windows" \
              "$RUNNER_TEMP/results/$ue/mac" \
              "$RUNNER_TEMP/results/$ue/windows"
            gh run download "$MAC_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "loomle-fab-plugin-$ue-darwin-arm64" \
              --dir "$RUNNER_TEMP/qa/$ue/mac"
            gh run download "$MAC_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "loomle-native-test-results-$ue-darwin-arm64" \
              --dir "$RUNNER_TEMP/results/$ue/mac"
            gh run download "$WINDOWS_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "loomle-fab-plugin-$ue-win32-x64" \
              --dir "$RUNNER_TEMP/qa/$ue/windows"
            gh run download "$WINDOWS_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "loomle-native-test-results-$ue-win32-x64" \
              --dir "$RUNNER_TEMP/results/$ue/windows"
          done
          gh run download "$MAC_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name loomle-fab-source-darwin-arm64 \
            --dir "$RUNNER_TEMP/fab-source/mac"
          gh run download "$WINDOWS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name loomle-fab-source-win32-x64 \
            --dir "$RUNNER_TEMP/fab-source/windows"

      - name: Verify Fab Source Archives
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin-arm64 win32-x64; do
            platform_dir="mac"
            [[ "$target" == "win32-x64" ]] && platform_dir="windows"
            archive="$RUNNER_TEMP/fab-source/$platform_dir/loomle-fab-source-ue5.7-$target.zip"
            sidecar="$archive.sha256"
            [[ -s "$archive" && -s "$sidecar" ]] || {
              echo "Fab source archive or checksum is missing for $target." >&2
              exit 1
            }
            expected="$(awk 'NR == 1 { print $1 }' "$sidecar" | tr -d '\r')"
            actual="$(sha256sum "$archive" | awk '{ print $1 }')"
            [[ "$expected" == "$actual" ]] || {
              echo "Fab source archive checksum mismatch for $target." >&2
              exit 1
            }
            expected_name="loomle-fab-source-ue5.7-$target.zip"
            sidecar_name="$(awk 'NR == 1 { print $2 }' "$sidecar" | tr -d '\r')"
            [[ "$sidecar_name" == "$expected_name" ]] || {
              echo "Fab source checksum names $sidecar_name; expected $expected_name." >&2
              exit 1
            }
            entries="$RUNNER_TEMP/fab-source-$target.entries"
            unzip -Z1 "$archive" > "$entries"
            grep -Fxq "LoomleBridge/Source/" "$entries" || {
              echo "Fab source archive is missing Source for $target." >&2
              exit 1
            }
            if grep -Eq '^LoomleBridge/(Binaries|Intermediate|Saved)(/|$)' "$entries"; then
              echo "Fab source archive contains generated UE output for $target." >&2
              exit 1
            fi
          done

      - name: Verify Promotion Contract
        id: release
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          validation="$RUNNER_TEMP/promotion-validation.json"
          node packaging/release/validate-promotion.mjs \
            --repo-root "$GITHUB_WORKSPACE" \
            --ue5.7-darwin-arm64-archive "$RUNNER_TEMP/qa/ue5.7/mac/loomle-fab-plugin-ue5.7-darwin-arm64.zip" \
            --ue5.7-darwin-arm64-sha-file "$RUNNER_TEMP/qa/ue5.7/mac/loomle-fab-plugin-ue5.7-darwin-arm64.zip.sha256" \
            --ue5.7-darwin-arm64-automation-result "$RUNNER_TEMP/results/ue5.7/mac/loomle-automation-results-ue5.7-darwin-arm64/result.json" \
            --ue5.7-darwin-arm64-e2e-result "$RUNNER_TEMP/results/ue5.7/mac/loomle-packaged-e2e-results-ue5.7-darwin-arm64/result.json" \
            --ue5.7-win32-x64-archive "$RUNNER_TEMP/qa/ue5.7/windows/loomle-fab-plugin-ue5.7-win32-x64.zip" \
            --ue5.7-win32-x64-sha-file "$RUNNER_TEMP/qa/ue5.7/windows/loomle-fab-plugin-ue5.7-win32-x64.zip.sha256" \
            --ue5.7-win32-x64-automation-result "$RUNNER_TEMP/results/ue5.7/windows/loomle-automation-results-ue5.7-win32-x64/result.json" \
            --ue5.7-win32-x64-e2e-result "$RUNNER_TEMP/results/ue5.7/windows/loomle-packaged-e2e-results-ue5.7-win32-x64/result.json" \
            --ue5.8-darwin-arm64-archive "$RUNNER_TEMP/qa/ue5.8/mac/loomle-fab-plugin-ue5.8-darwin-arm64.zip" \
            --ue5.8-darwin-arm64-sha-file "$RUNNER_TEMP/qa/ue5.8/mac/loomle-fab-plugin-ue5.8-darwin-arm64.zip.sha256" \
            --ue5.8-darwin-arm64-automation-result "$RUNNER_TEMP/results/ue5.8/mac/loomle-automation-results-ue5.8-darwin-arm64/result.json" \
            --ue5.8-darwin-arm64-e2e-result "$RUNNER_TEMP/results/ue5.8/mac/loomle-packaged-e2e-results-ue5.8-darwin-arm64/result.json" \
            --ue5.8-win32-x64-archive "$RUNNER_TEMP/qa/ue5.8/windows/loomle-fab-plugin-ue5.8-win32-x64.zip" \
            --ue5.8-win32-x64-sha-file "$RUNNER_TEMP/qa/ue5.8/windows/loomle-fab-plugin-ue5.8-win32-x64.zip.sha256" \
            --ue5.8-win32-x64-automation-result "$RUNNER_TEMP/results/ue5.8/windows/loomle-automation-results-ue5.8-win32-x64/result.json" \
            --ue5.8-win32-x64-e2e-result "$RUNNER_TEMP/results/ue5.8/windows/loomle-packaged-e2e-results-ue5.8-win32-x64/result.json" \
            --head-sha "$HEAD_SHA" \
            --channel "$CHANNEL" > "$validation"
          tag="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).tag' "$validation")"
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).version' "$validation")"
          notes="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).notesPath' "$validation")"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Cross-Platform Release Packages
        id: packages
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          fragments="$RUNNER_TEMP/fragments"
          release_root="$RUNNER_TEMP/release"
          mkdir -p \
            "$fragments/mac-source" \
            "$fragments/windows-source" \
            "$release_root/assets"

          unzip -q \
            "$RUNNER_TEMP/fab-source/mac/loomle-fab-source-ue5.7-darwin-arm64.zip" \
            -d "$fragments/mac-source"
          unzip -q \
            "$RUNNER_TEMP/fab-source/windows/loomle-fab-source-ue5.7-win32-x64.zip" \
            -d "$fragments/windows-source"
          for engine in 5.7 5.8; do
            ue="ue$engine"
            mkdir -p \
              "$fragments/$ue/mac-plugin" \
              "$fragments/$ue/windows-plugin" \
              "$release_root/source-$ue" \
              "$release_root/plugin-$ue"
            unzip -q \
              "$RUNNER_TEMP/qa/$ue/mac/loomle-fab-plugin-$ue-darwin-arm64.zip" \
              -d "$fragments/$ue/mac-plugin"
            unzip -q \
              "$RUNNER_TEMP/qa/$ue/windows/loomle-fab-plugin-$ue-win32-x64.zip" \
              -d "$fragments/$ue/windows-plugin"

            node packaging/release/merge-platform-packages.mjs \
              --mac-source-plugin "$fragments/mac-source/LoomleBridge" \
              --mac-plugin "$fragments/$ue/mac-plugin/LoomleBridge" \
              --windows-source-plugin "$fragments/windows-source/LoomleBridge" \
              --windows-plugin "$fragments/$ue/windows-plugin/LoomleBridge" \
              --output-source-plugin "$release_root/source-$ue/LoomleBridge" \
              --output-plugin "$release_root/plugin-$ue/LoomleBridge" \
              --engine-version "$engine"

            plugin_archive="$release_root/assets/loomle-bridge-$VERSION-$ue.zip"
            plugin_alias="$release_root/assets/loomle-bridge-$ue.zip"
            (
              cd "$release_root/plugin-$ue"
              zip -qry "$plugin_archive" LoomleBridge
            )
            cp "$plugin_archive" "$plugin_alias"
            cmp -s "$plugin_archive" "$plugin_alias"
            (
              cd "$release_root/assets"
              sha256sum "$(basename "$plugin_archive")" > "$(basename "$plugin_archive").sha256"
              sha256sum "$(basename "$plugin_alias")" > "$(basename "$plugin_alias").sha256"
            )

            plugin_entries="$RUNNER_TEMP/merged-$ue-plugin.entries"
            unzip -Z1 "$plugin_archive" > "$plugin_entries"
            for required in \
              LoomleBridge/Resources/Loomle/darwin-arm64/loomle \
              LoomleBridge/Resources/Loomle/win32-x64/loomle.exe \
              LoomleBridge/Source/ \
              LoomleBridge/Binaries/Mac/UnrealEditor.modules \
              LoomleBridge/Binaries/Win64/UnrealEditor.modules \
              LoomleBridge/Binaries/Win64/UnrealEditor-LoomleBridge.dll; do
              grep -Fxq "$required" "$plugin_entries" || {
                echo "Merged $ue plugin archive is missing $required." >&2
                exit 1
              }
            done
            mac_bridge="$(node -e '
              const manifest = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
              process.stdout.write(manifest.Modules.LoomleBridge);
            ' "$release_root/plugin-$ue/LoomleBridge/Binaries/Mac/UnrealEditor.modules")"
            grep -Fxq "LoomleBridge/Binaries/Mac/$mac_bridge" "$plugin_entries"
          done

          cmp -s \
            "$release_root/source-ue5.7/LoomleBridge/LoomleBridge.uplugin" \
            "$release_root/source-ue5.8/LoomleBridge/LoomleBridge.uplugin"
          source_archive="$release_root/assets/loomle-bridge-$VERSION-source.zip"
          source_alias="$release_root/assets/loomle-bridge-source.zip"
          (
            cd "$release_root/source-ue5.7"
            zip -qry "$source_archive" LoomleBridge
          )
          cp "$source_archive" "$source_alias"
          cmp -s "$source_archive" "$source_alias"
          (
            cd "$release_root/assets"
            sha256sum "$(basename "$source_archive")" > "$(basename "$source_archive").sha256"
            sha256sum "$(basename "$source_alias")" > "$(basename "$source_alias").sha256"
          )
          source_entries="$RUNNER_TEMP/merged-source.entries"
          unzip -Z1 "$source_archive" > "$source_entries"
          if grep -Eq '^LoomleBridge/(Binaries|Intermediate|Saved)(/|$)' "$source_entries"; then
            echo "Merged source archive contains generated UE output." >&2
            exit 1
          fi

          echo "source_archive=$source_archive" >> "$GITHUB_OUTPUT"
          echo "source_sha_file=$source_archive.sha256" >> "$GITHUB_OUTPUT"
          echo "source_alias=$source_alias" >> "$GITHUB_OUTPUT"
          echo "source_alias_sha_file=$source_alias.sha256" >> "$GITHUB_OUTPUT"
          for engine in 5.7 5.8; do
            key="ue${engine//./_}"
            ue="ue$engine"
            echo "${key}_archive=$release_root/assets/loomle-bridge-$VERSION-$ue.zip" >> "$GITHUB_OUTPUT"
            echo "${key}_sha_file=$release_root/assets/loomle-bridge-$VERSION-$ue.zip.sha256" >> "$GITHUB_OUTPUT"
            echo "${key}_alias=$release_root/assets/loomle-bridge-$ue.zip" >> "$GITHUB_OUTPUT"
            echo "${key}_alias_sha_file=$release_root/assets/loomle-bridge-$ue.zip.sha256" >> "$GITHUB_OUTPUT"
          done

      - name: Require Exact Tag And New Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          tag_ref="$RUNNER_TEMP/release-tag.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$tag_ref"
          tag_type="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).object.type' "$tag_ref")"
          tag_sha="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).object.sha' "$tag_ref")"
          if [[ "$tag_type" != "commit" || "$tag_sha" != "$HEAD_SHA" ]]; then
            echo "Release tag $TAG resolves to $tag_type $tag_sha; expected commit $HEAD_SHA." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi

      - name: Publish Exact Verified Release
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          NOTES: ${{ steps.release.outputs.notes }}
          UE_5_7_ARCHIVE: ${{ steps.packages.outputs.ue5_7_archive }}
          UE_5_7_SHA_FILE: ${{ steps.packages.outputs.ue5_7_sha_file }}
          UE_5_7_ALIAS: ${{ steps.packages.outputs.ue5_7_alias }}
          UE_5_7_ALIAS_SHA_FILE: ${{ steps.packages.outputs.ue5_7_alias_sha_file }}
          UE_5_8_ARCHIVE: ${{ steps.packages.outputs.ue5_8_archive }}
          UE_5_8_SHA_FILE: ${{ steps.packages.outputs.ue5_8_sha_file }}
          UE_5_8_ALIAS: ${{ steps.packages.outputs.ue5_8_alias }}
          UE_5_8_ALIAS_SHA_FILE: ${{ steps.packages.outputs.ue5_8_alias_sha_file }}
          SOURCE_ARCHIVE: ${{ steps.packages.outputs.source_archive }}
          SOURCE_SHA_FILE: ${{ steps.packages.outputs.source_sha_file }}
          SOURCE_ALIAS: ${{ steps.packages.outputs.source_alias }}
          SOURCE_ALIAS_SHA_FILE: ${{ steps.packages.outputs.source_alias_sha_file }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          channel_args=(--latest)
          release_assets=(
            "$SOURCE_ARCHIVE"
            "$SOURCE_SHA_FILE"
            "$UE_5_7_ARCHIVE"
            "$UE_5_7_SHA_FILE"
            "$UE_5_8_ARCHIVE"
            "$UE_5_8_SHA_FILE"
            "$SOURCE_ALIAS"
            "$SOURCE_ALIAS_SHA_FILE"
            "$UE_5_7_ALIAS"
            "$UE_5_7_ALIAS_SHA_FILE"
            "$UE_5_8_ALIAS"
            "$UE_5_8_ALIAS_SHA_FILE"
          )
          if [[ "$CHANNEL" == "prerelease" ]]; then
            channel_args=(--prerelease)
            release_assets=(
              "$SOURCE_ARCHIVE"
              "$SOURCE_SHA_FILE"
              "$UE_5_7_ARCHIVE"
              "$UE_5_7_SHA_FILE"
              "$UE_5_8_ARCHIVE"
              "$UE_5_8_SHA_FILE"
            )
          fi
          gh release create "$TAG" \
            "${release_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Loomle $VERSION" \
            --notes-file "$NOTES" \
            "${channel_args[@]}"
